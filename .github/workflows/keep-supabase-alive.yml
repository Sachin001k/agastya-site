name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */4 * *'  # every 4 days at 06:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "Missing Supabase configuration. Set SUPABASE_URL/SUPABASE_ANON_KEY (or NEXT_PUBLIC_ variants) as repository secrets or variables."
            exit 1
          fi

          curl -sf -o /dev/null \
            "${SUPABASE_URL}/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: ******"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
